name: Build and push MXE Docker image
on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - 'src/*.mk'
      - 'src/*.patch'
      - 'src/*.c'
      - 'settings.mk'
  workflow_dispatch:

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/jbenham2015/mxe:latest
          cache-from: type=registry,ref=ghcr.io/jbenham2015/mxe:buildcache
          cache-to: type=registry,ref=ghcr.io/jbenham2015/mxe:buildcache,mode=max
          outputs: type=image,push=true
